name: Integration

on:
  pull_request:
    branches:
      - '**'
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'

jobs:
  lint:
    name: esLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and Configure Git Client
        uses: id-fabrik/workflows/.github/actions/configure-npm-git@main
        with:
          token: ${{ secrets.BOT_USER_PAT }}

      - name: Base Setup with node and pnpm
        uses: ./.github/actions/base_setup

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Eslint
        run: pnpm lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout and Configure Git Client
        uses: id-fabrik/workflows/.github/actions/configure-npm-git@main
        with:
          token: ${{ secrets.BOT_USER_PAT }}

      - name: Base Setup with node and pnpm
        uses: ./.github/actions/base_setup

      - name: Install OnePassword CLI
        uses: id-fabrik/workflows/.github/actions/install-onepassword-cli@main

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Override STAGE if Invalid
        if: env.STAGE != 'main' && env.STAGE != 'development' && env.STAGE != 'staging'
        run: |
          echo "STAGE=development" >> $GITHUB_ENV
          echo "STAGE set to default development"

      - name: Check Stage
        run: echo "You Are Building on $STAGE"

      - name: Check for Dot Env File
        id: check-env-file
        run: |
          if [ -f ".env" ]; then
            echo "DOT_ENV=true" >> $GITHUB_OUTPUT
          else
            echo "DOT_ENV=false" >> $GITHUB_OUTPUT
          fi

      - name: Set OnePassword Vault to Main Stage
        if: steps.check-env-file.outputs.DOT_ENV == 'true' && env.STAGE == 'main'
        run: |
          sed -i 's/idf-${{ inputs.project }}/&-main/' .env
          sed -i 's|development|main|' .env

      - name: Build
        run: pnpm build

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout and Configure Git Client
        uses: id-fabrik/workflows/.github/actions/configure-npm-git@main
        with:
          token: ${{ secrets.BOT_USER_PAT }}

      - name: Base Setup with node and pnpm
        uses: ./.github/actions/base_setup

      - name: Install OnePassword CLI
        uses: id-fabrik/workflows/.github/actions/install-onepassword-cli@main

      - name: Install Dependencies
        run: pnpm i --frozen-lockfile

      - name: Override STAGE if Invalid
        if: env.STAGE != 'main' && env.STAGE != 'development' && env.STAGE != 'staging'
        run: |
          echo "STAGE=development" >> $GITHUB_ENV
          echo "STAGE set to default development"

      - name: Check Stage
        run: echo "You Are Testing on $STAGE"

      - name: Check for Dot Env File
        id: check-env-file
        run: |
          if [ -f ".env" ]; then
            echo "DOT_ENV=true" >> $GITHUB_OUTPUT
          else
            echo "DOT_ENV=false" >> $GITHUB_OUTPUT
          fi

      - name: Set OnePassword Vault to Main Stage
        if: steps.check-env-file.outputs.DOT_ENV == 'true' && env.STAGE == 'main'
        run: |
          sed -i 's/idf-${{ inputs.project }}/&-main/' .env
          sed -i 's|development|main|' .env

      - name: Run Unit Tests
        run: pnpm test-coverage
